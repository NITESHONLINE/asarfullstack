<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 300px;
            width: 300px;
            /* border: 2px solid; */
            /* box-shadow: x-offset y-offset blur spread color; */
            box-shadow: inset 0px 0px 14px 3px gray;
            /* box-shadow: 0px 0px 14px 3px gray; */
            border-radius: 20px;
        }

        .box2{
            height: 300px;
            width: 300px;
            box-shadow: 7px 7px 0px 0px gray, 16px 10px 0px 0px blue, 30px 0px 0px 0px red, 40px 0px 0px 0px yellow;
            border-radius: 20px;
        }

        h1{
            text-shadow: 17px 0px 2px brown;
            font-size: 15rem;
        }
    </style>
</head>

<body>
    <div class="box"></div>

    <div class="box2"></div>

    <h1>Lorem ipsum dolor sit amet.</h1>

</body>

</html>
