<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>

    <style>
        table, tr, th, td{
            border: 2px solid;
            border-collapse: collapse;
        }

    </style>

</head>
<body>

    <table>
        <thead>
            <tr>
                <th>Person</th>
                <th>Age</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Chris</td>
                <td>38</td>
            </tr>

            <tr>
                <td>Dennis</td>
                <td>45</td>
            </tr>

            <tr>
                <td>Sarah</td>
                <td>29</td>
            </tr>

        </tbody>

    </table>



    <table>
        <thead>
            <tr>
                <th colspan="2">Name</th>
                <th>Age</th>
                <th colspan="2">Course</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Ninja</td>
                <td>1</td>
                <td>20</td>
                <td>c++</td>
                <td>Python</td>
            </tr>
        </tbody>




    </table>




</body>
</html>
